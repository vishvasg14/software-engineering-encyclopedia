# KRaft server.properties (Kafka 3.3+)
# Replace ZooKeeper with self-managed metadata quorum

# Node identity
node.id=1

# KRaft mode
process.roles=broker,controller

# Listeners
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER

# Controller quorum (3 controllers for HA)
controller.quorum.voters=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

# Cluster ID (must match across all nodes)
cluster.id=MkU3OEVBNTcwNTJENUM5Qk

# Replication (must be odd quorum size)
default.replication.factor=3
min.insync.replicas=2

# Directories
log.dirs=/var/lib/kafka/data
metadata.log.dir=/var/lib/kafka/metadata

# Other
auto.create.topics.enable=false
group.initial.rebalance.delay.ms=3000