# 17 — Prometheus configuration for Kafka monitoring

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kafka_broker
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: kafka_consumer_lag
    static_configs:
      - targets: ['burrow:8000']

# Alerting rules
rule_files:
  - alerts.yml

