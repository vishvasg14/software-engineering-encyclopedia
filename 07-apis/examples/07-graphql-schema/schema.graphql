# 07 — GraphQL schema

scalar DateTime

type User {
    id: ID!
    name: String!
    email: String!
    active: Boolean!
    createdAt: DateTime!
    friends: [User!]!
    posts: [Post!]!
}

type Post {
    id: ID!
    title: String!
    content: String!
    author: User!
    createdAt: DateTime!
    comments: [Comment!]!
}

type Comment {
    id: ID!
    content: String!
    author: User!
    createdAt: DateTime!
}

type Query {
    user(id: ID!): User
    users(limit: Int = 20, offset: Int = 0, active: Boolean): [User!]!
    me: User
    feed(limit: Int = 20): [Post!]!
}

input CreateUserInput {
    name: String!
    email: String!
}

input UpdateUserInput {
    name: String
    email: String
    active: Boolean
}

type Mutation {
    createUser(input: CreateUserInput!): User!
    updateUser(id: ID!, input: UpdateUserInput!): User!
    deleteUser(id: ID!): DeleteResult!
}

type Subscription {
    userCreated: User!
    userUpdated(id: ID!): User!
}

type DeleteResult {
    success: Boolean!
    id: ID!
}

schema {
    query: Query
    mutation: Mutation
    subscription: Subscription
}