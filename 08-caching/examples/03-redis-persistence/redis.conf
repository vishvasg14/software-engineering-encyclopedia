# 03 — Redis persistence configuration

# RDB (snapshots)
# Format: save <seconds> <changes>
save 900 1      # Snapshot every 15 min if at least 1 key changed
save 300 10     # Snapshot every 5 min if at least 10 keys changed
save 60 10000   # Snapshot every minute if at least 10K keys changed

# Where to save RDB
dir /var/lib/redis
dbfilename dump.rdb

# AOF (append-only file)
appendonly yes
appendfilename "appendonly.aof"

# Fsync policy
# always: fsync after every write (slow, durable)
# everysec: fsync every second (default, balanced)
# no: let OS decide (fast, may lose data)
appendfsync everysec

# Auto-rewrite AOF to compact
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Hybrid mode (since 4.0): AOF starts with RDB snapshot
aof-use-rdb-preamble yes

# Persistence strategy
# Cache workloads: use volatile-* policies (evict keys with TTL set)
# maxmemory 4gb
# maxmemory-policy allkeys-lfu
# Or, with TTLs only on some keys:
# maxmemory-policy volatile-lfu

# Memory tuning
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64