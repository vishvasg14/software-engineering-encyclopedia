# 04 — Redis Sentinel configuration

# Sentinel runs on its own port (default 26379)
port 26379

# Sentinel monitor
# Format: sentinel monitor <name> <ip> <port> <quorum>
sentinel monitor mymaster 127.0.0.1 6379 2

# Sentinel auth (if Redis has requirepass)
sentinel auth-pass mymaster yourpassword

# How long to wait before considering master down
sentinel down-after-milliseconds mymaster 5000

# How many sentinels must agree for failover
sentinel parallel-syncs mymaster 1

# How long to wait for failover to complete
sentinel failover-timeout mymaster 10000

# Notification script
# sentinel notification-script mymaster /path/to/notify.sh

# Replica configuration on the master
# replicaof <master-ip> <master-port>
# replica-serve-stale-data yes
# replica-read-only yes
# repl-backlog-size 1mb
# repl-backlog-ttl 3600

# Min replicas to write
# min-replicas-to-write 1
# min-replicas-max-lag 10