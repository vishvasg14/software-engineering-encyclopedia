# 11 — AWS CloudFront (CloudFormation)

Resources:
  # Origin Access Control (OAC) for S3
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      Name: my-oac
      OriginAccessControlConfig:
        Name: my-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront distribution
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: My CDN
        DefaultRootObject: index.html
        PriceClass: PriceClass_100  # use only North America and Europe
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: my-bucket.s3.amazonaws.com
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''  # Use OAC instead
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-e63d-46c3-befe-1d6bdf5b00cd  # CachingOptimized
          TTL: 86400  # 1 day default TTL
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a0-93fa-79d36eb7c129  # CachingDisabled
            TTL: 0
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:ACCOUNT:certificate/CERT
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        IPV6Enabled: true
        Logging:
          Bucket: my-cf-logs.s3.amazonaws.com
          Prefix: cloudfront/
          IncludeCookies: false

  # S3 bucket policy: only CloudFront can read
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: my-bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: arn:aws:s3:::my-bucket/*
            Condition:
              StringEquals:
                AWS:SourceAccount: ACCOUNT