<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Engineering Encyclopedia — Reader</title>
  <link rel="stylesheet" href="assets/askgpt.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 6rem;
      line-height: 1.55;
      color: #1a1a1a;
      background: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f0f; color: #e6e6e6; }
      a { color: #7ec7ff; }
      pre, code { background: #1c1c1c; color: #e6e6e6; }
      table { border-color: #333; }
      th, td { border-color: #333; }
      blockquote { border-color: #444; color: #ccc; }
    }
    nav.topbar {
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      nav.topbar { background: #1a1a1a; border-color: #333; }
    }
    nav.topbar select {
      font-size: 0.95rem;
      padding: 0.3rem 0.5rem;
      margin-left: 0.5rem;
    }
    nav.topbar a { margin-right: 0.8rem; }
    article {
      background: #ffffff;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      padding: 1.5rem 2rem;
    }
    @media (prefers-color-scheme: dark) {
      article { background: #1a1a1a; border-color: #333; }
    }
    h1, h2, h3, h4, h5, h6 { line-height: 1.25; }
    h1 { font-size: 1.75rem; margin-top: 0; }
    h2 { font-size: 1.4rem; border-bottom: 1px solid #eee; padding-bottom: 0.3rem; margin-top: 2rem; }
    @media (prefers-color-scheme: dark) {
      h2 { border-bottom-color: #333; }
    }
    h3 { font-size: 1.15rem; margin-top: 1.5rem; }
    pre {
      background: #f4f4f4;
      border-radius: 4px;
      padding: 0.7rem 0.9rem;
      overflow-x: auto;
      font-size: 0.85rem;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    p > code, li > code { background: #f0f0f0; padding: 0.05rem 0.3rem; border-radius: 3px; font-size: 0.9em; }
    @media (prefers-color-scheme: dark) {
      p > code, li > code { background: #2a2a2a; }
    }
    table { border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.4rem 0.7rem; }
    blockquote {
      border-left: 3px solid #ddd;
      margin-left: 0;
      padding-left: 1rem;
      color: #555;
    }
    .loading, .error {
      text-align: center;
      padding: 2rem;
      color: #888;
    }
    .error { color: #c00; }
    .mermaid {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 1rem;
      margin: 1rem 0;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .mermaid { background: #1a1a1a; border-color: #333; }
    }
  </style>
</head>
<body>

<nav class="topbar">
  <strong>Software Engineering Encyclopedia</strong>
  <span style="color:#888; margin-left:0.5rem;">(reader)</span>
  &nbsp;|&nbsp;
  <label for="chapter-picker">Chapter:
    <select id="chapter-picker"></select>
  </label>
  &nbsp;|&nbsp;
  <a href="https://github.com/vishvasg14/software-engineering-encyclopedia#table-of-contents">Index</a>
</nav>

<article id="content">
  <div class="loading">Loading…</div>
</article>

<script>
  // Tiny chapter index — kept in sync with the repo's chapters/ top-level.
  // If you add a new chapter dir, add an entry here.
  const CHAPTERS = [
    { num: '01', slug: 'java-internals',        dir: '01-java-internals',        file: 'jvm-internals.md',           title: 'Java Internals' },
    { num: '02', slug: 'javascript-typescript', dir: '02-javascript-typescript', file: 'javascript-typescript.md',    title: 'JavaScript & TypeScript' },
    { num: '03', slug: 'sql-databases',         dir: '03-sql-databases',         file: 'sql-databases.md',           title: 'SQL & Databases' },
    { num: '04', slug: 'spring-ecosystem',      dir: '04-spring-ecosystem',      file: 'spring-ecosystem.md',        title: 'Spring Ecosystem' },
    { num: '05', slug: 'frontend',              dir: '05-frontend',              file: 'frontend.md',                title: 'Frontend (Angular, Signals, RxJS)' },
    { num: '06', slug: 'messaging',             dir: '06-messaging',             file: 'messaging.md',               title: 'Messaging (Kafka, RabbitMQ, Pulsar)' },
    { num: '07', slug: 'apis',                  dir: '07-apis',                  file: 'apis.md',                    title: 'APIs (REST, GraphQL, gRPC, WebSocket)' },
    { num: '08', slug: 'caching',               dir: '08-caching',               file: 'caching.md',                 title: 'Caching (Redis, Caffeine, Memcached)' },
    { num: '09', slug: 'system-design',         dir: '09-system-design',         file: 'system-design.md',           title: 'System Design & Distributed Systems' },
    { num: '10', slug: 'devops',                dir: '10-devops',                file: 'devops.md',                  title: 'DevOps (Docker, Kubernetes, Helm, Istio)' },
    { num: '11', slug: 'cloud',                 dir: '11-cloud',                 file: 'cloud.md',                   title: 'Cloud (AWS, Azure, GCP)' },
    { num: '12', slug: 'observability',         dir: '12-observability',         file: 'observability.md',           title: 'Observability (Prometheus, Grafana, OpenTelemetry)' },
    { num: '13', slug: 'security',              dir: '13-security',              file: 'security.md',                title: 'Security (OWASP, OAuth2, JWT, Encryption)' },
    { num: '14', slug: 'testing',               dir: '14-testing',               file: 'testing.md',                 title: 'Testing (Unit, Integration, Contract, Chaos)' },
    { num: '15', slug: 'git',                   dir: '15-git',                   file: 'git.md',                     title: 'Git & Versioning' },
    { num: '16', slug: 'software-engineering',  dir: '16-software-engineering',  file: 'software-engineering.md',    title: 'Software Engineering (SOLID, Patterns, Refactoring)' },
  ];

  // Populate the chapter picker
  const picker = document.getElementById('chapter-picker');
  CHAPTERS.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.num;
    opt.textContent = `${c.num}. ${c.title}`;
    picker.appendChild(opt);
  });

  // Pick chapter from URL hash, e.g. #04
  function currentChapterNum() {
    const m = location.hash.match(/^#(\d{2})/);
    return m ? m[1] : '01';
  }
  function basename(num) {
    const c = CHAPTERS.find(x => x.num === num);
    return c ? `${c.dir}/${c.file}` : null;
  }

  function mdToHtml(md) {
    const renderer = new marked.Renderer();

    // Override the heading renderer to split the heading text from the
    // trailing <a class="askgpt-btn">…</a>. marked treats <a> inside a
    // heading line as inline HTML and re-parses its href (which contains a
    // long URL-encoded prompt), corrupting the output. We split the line
    // ourselves and emit the heading text and the button as separate HTML.
    function renderHeading(text, level) {
      // Split off the trailing <a …>…</a> if present.
      var m = text.match(/^([\s\S]*?)\s*(<a class=['"]askgpt-btn['"][\s\S]*?<\/a>)\s*$/);
      var inner;
      if (m) {
        var headingText = m[1].trim();
        var buttonHtml = m[2];
        inner = escapeHtml(headingText) + ' ' + buttonHtml;
      } else {
        inner = escapeHtml(text);
      }
      return '<h' + level + '>' + inner + '</h' + level + '>\n';
    }
    renderer.heading = function (text, level) {
      return renderHeading(text, level);
    };
    // Some marked versions pass raw vs escaped separately
    renderer.heading = function (text, level, raw) {
      return renderHeading(raw || text, level);
    };

    // Mermaid code blocks → <div class="mermaid">…</div>
    renderer.code = function (code, lang) {
      if (lang === 'mermaid') {
        return '<div class="mermaid">' + code + '</div>';
      }
      return '<pre><code>' + escapeHtml(code) + '</code></pre>';
    };

    // marked v12 uses object-style options
    marked.use({ renderer: renderer, gfm: true, breaks: false });
    return marked.parse(md);
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadChapter(num) {
    const path = basename(num);
    const article = document.getElementById('content');
    if (!path) {
      article.innerHTML = `<div class="error">Unknown chapter: ${num}</div>`;
      return;
    }
    article.innerHTML = '<div class="loading">Loading…</div>';
    try {
      // Pages is configured to serve from /docs, but the chapter markdown
      // files live at the repo root. Fetch from raw.githubusercontent.com
      // instead — that endpoint serves the full repo and is CORS-enabled
      // for public repos.
      const url = 'https://raw.githubusercontent.com/vishvasg14/software-engineering-encyclopedia/main/' + path;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const md = await res.text();
      article.innerHTML = mdToHtml(md);
      // Re-trigger askgpt init for the freshly-injected buttons.
      if (window.askgptInit) window.askgptInit();
      else initAskGPT();
      // Run mermaid against the freshly-injected <div class="mermaid">
      // elements (startOnLoad already ran on first page load and missed them).
      if (window.mermaid && typeof window.mermaid.run === 'function') {
        try {
          await window.mermaid.run({
            nodes: article.querySelectorAll('.mermaid'),
          });
        } catch (e) {
          console.warn('mermaid.render failed for some blocks:', e);
        }
      }
      location.hash = '#' + num;
    } catch (err) {
      article.innerHTML = `<div class="error">Failed to load <code>${path}</code>: ${err.message}</div>`;
    }
  }

  // Expose a re-init function so askgpt.js can hook into it.
  // We expose askgptInit on window; askgpt.js IIFE assigns it.
  window.askgptInit = function () {};

  function initAskGPT() {
    const buttons = document.querySelectorAll('a.askgpt-btn');
    buttons.forEach(btn => {
      if (btn.dataset.askgptBound) return;  // idempotent
      btn.dataset.askgptBound = '1';
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const section = btn.getAttribute('data-askgpt') || 'this section';
        const url = btn.getAttribute('data-askgpt-url') || btn.getAttribute('href') || '';
        if (window.askgptShowModal) {
          window.askgptShowModal(section, url);
        } else {
          // Fallback if askgpt.js IIFE hasn't exposed the helper yet:
          window.open(btn.getAttribute('href'), '_blank', 'noopener');
        }
      });
    });
  }

  picker.addEventListener('change', () => loadChapter(picker.value));
  window.addEventListener('hashchange', () => {
    const num = currentChapterNum();
    picker.value = num;
    loadChapter(num);
  });

  // Initial load
  picker.value = currentChapterNum();
  loadChapter(currentChapterNum());
</script>

<!-- Markdown parser: marked.js (vendored as a pinned version for Pages reliability) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<!-- Mermaid renderer (only runs against <div class="mermaid"> blocks) -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  if (window.mermaid) mermaid.initialize({ startOnLoad: true, securityLevel: 'loose', theme: document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default') });
</script>

<!-- AskGPT click handler + modal -->
<script src="assets/askgpt.js"></script>
<script>
  // After askgpt.js has run its IIFE, expose a re-init so we can re-bind
  // buttons whenever a new chapter is loaded.
  (function rebind() {
    const buttons = document.querySelectorAll('a.askgpt-btn');
    buttons.forEach(btn => {
      // askgpt.js already bound these (it runs init() on DOMContentLoaded
      // or immediately if the doc is already parsed). Nothing more to do.
    });
  })();
</script>

</body>
</html>
